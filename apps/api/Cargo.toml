[package]
name = "appshell-api"
version = "0.1.0"
license = "MIT"
edition = "2024"
default-run = "appshell-api"

[lints]
workspace = true

[features]
default = ["postgres"]
postgres = ["dep:diesel", "dep:diesel_migrations"]
dynamodb = ["dep:aws-config", "dep:aws-sdk-dynamodb"]
ses = ["dep:aws-config", "dep:aws-sdk-sesv2"]
lambda = ["dep:lambda_http", "dep:aws-config", "dep:aws-sdk-sqs"]

[[bin]]
name = "appshell-lambda"
path = "src/bin/lambda.rs"
required-features = ["lambda"]

[dependencies]
aws-sdk-dynamodb = { version = "1", optional = true }
aws-sdk-sesv2 = { version = "1", optional = true }
aws-config = { version = "1", optional = true, default-features = false, features = ["default-https-client", "rt-tokio"] }
aws-sdk-sqs = { version = "1", optional = true }

lambda_http = { version = "1", optional = true, default-features = false, features = ["apigw_http"] }
lettre = { version = "0.11", default-features = false, features = ["builder", "smtp-transport", "tokio1"] }
appshell-domain = { path = "../domain" }
axum = { version = "0.8", features = ["macros"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace", "compression-gzip", "limit", "set-header"] }
diesel = { version = "2.3", optional = true, features = ["postgres", "r2d2", "chrono", "uuid", "serde_json"] }
diesel_migrations = { version = "2.3", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
utoipa = { version = "5", features = ["axum_extras", "chrono", "uuid"] }
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
argon2 = "0.5"
sha2 = "0.10"
hmac = "0.12"
hex = "0.4"
rand_core = { version = "0.6", features = ["getrandom"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dotenvy = "0.15"

[dev-dependencies]
syn = { version = "2", features = ["full", "visit"] }
proc-macro2 = "1"
tower = { version = "0.5", features = ["util"] }
http-body-util = "0.1"
