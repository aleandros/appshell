<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#147d64" />
    <meta
      name="description"
      content="A thoughtful home for your next big idea. Bring your work and your people together with AppShell."
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>AppShell — Space to build</title>
    <script>
      try {
        const t = localStorage.getItem('appshell-theme') || 'system';
        document.documentElement.dataset.theme =
          t === 'system'
            ? matchMedia('(prefers-color-scheme: dark)').matches
              ? 'dark'
              : 'light'
            : t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
