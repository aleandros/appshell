name: Infrastructure
on: [workflow_call, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Validate GitHub workflows
        run: docker run --rm -v "$PWD:/repo:ro" -w /repo rhysd/actionlint:1.7.12
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: pip install cfn-lint==1.46.0
      - run: cfn-lint deploy/lambda/template.yaml
