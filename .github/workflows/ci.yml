name: Checks
on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      deploy:
        description: Deploy the saved configuration after all checks pass (default branch only)
        type: boolean
        default: false
concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  # A new commit must not interrupt migrations or an in-progress deployment.
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: appshell
          POSTGRES_USER: appshell
          POSTGRES_PASSWORD: appshell
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U appshell"
          --health-interval 3s --health-timeout 3s --health-retries 20
      mailpit:
        image: axllent/mailpit:v1.29
        ports: ['1025:1025', '8025:8025']
        options: --health-cmd "/mailpit readyz" --health-interval 3s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgres://appshell:appshell@localhost:5432/appshell
      TEST_DATABASE_URL: postgres://appshell:appshell@localhost:5432/appshell
      APP_URL: http://localhost:5173
      MAIL_MODE: smtp
      SMTP_HOST: localhost
      MAIL_FROM: AppShell <hello@appshell.test>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
        with: { components: 'clippy, rustfmt' }
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libpq-dev
      - run: npm ci
      - run: npm run check
      - run: npm run test:rust
      - run: npm run check:api
      - run: npm test && npm run build && npm run build:storybook
      - run: npx playwright install --with-deps chromium
      - run: |
          JOB_BACKEND=postgres RUN_MODE=api cargo run --locked --bin appshell-api > /tmp/appshell-api.log 2>&1 &
          JOB_BACKEND=postgres RUN_MODE=worker cargo run --locked --bin appshell-api > /tmp/appshell-worker.log 2>&1 &
          npm run test:e2e
          npm run test:mail
          npm run test:storybook
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-test-results
          path: |
            apps/web/test-results
            packages/ui/test-results
  dynamodb:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DYNAMODB_TABLE: appshell-ci
      DYNAMODB_ENDPOINT_URL: http://localhost:8000
      DYNAMODB_CREATE_TABLE: 'true'
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
      AWS_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: 'true'
      APP_URL: http://localhost:5173
      MAIL_MODE: smtp
      MAIL_FROM: AppShell <hello@appshell.test>
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with: { key: dynamodb }
      - run: npm ci
      - run: npm run test:dynamodb
      - run: docker compose -f compose.dynamodb.yaml up -d mailpit
      - run: npx playwright install --with-deps chromium
      - run: cargo build --locked --no-default-features --features dynamodb --bin appshell-api
      - run: |
          cargo run --locked --no-default-features --features dynamodb --bin appshell-api > /tmp/appshell-dynamodb.log 2>&1 &
          npm run test:e2e
          npm run test:mail
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: dynamodb-browser-test-results
          path: apps/web/test-results
  container:
    strategy:
      matrix:
        include:
          - { dockerfile: Dockerfile, storage: postgres, runner: ubuntu-latest }
          - { dockerfile: Dockerfile.lambda, storage: postgres, runner: ubuntu-latest }
          - { dockerfile: Dockerfile.lambda, storage: dynamodb, runner: ubuntu-latest }
          - { dockerfile: Dockerfile.lambda, storage: postgres, runner: ubuntu-24.04-arm }
          - { dockerfile: Dockerfile.lambda, storage: dynamodb, runner: ubuntu-24.04-arm }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: STORAGE=${{ matrix.storage }}
          push: false
          cache-from: type=gha,scope=${{ matrix.dockerfile }}-${{ matrix.storage }}-${{ matrix.runner }}
          cache-to: type=gha,mode=max,scope=${{ matrix.dockerfile }}-${{ matrix.storage }}-${{ matrix.runner }}
  infrastructure:
    uses: ./.github/workflows/infrastructure.yml
  deploy:
    needs: [check, dynamodb, container, infrastructure]
    if: >-
      github.ref == format('refs/heads/{0}', github.event.repository.default_branch) &&
      (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.deploy))
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/deploy.yml
    with:
      manual: ${{ github.event_name == 'workflow_dispatch' && inputs.deploy }}
    secrets:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
