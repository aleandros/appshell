name: appshell-sam-local
services:
  localstack:
    image: ${LOCALSTACK_IMAGE:-localstack/localstack:latest}
    ports: ['127.0.0.1:4566:4566']
    environment:
      LOCALSTACK_AUTH_TOKEN: ${LOCALSTACK_AUTH_TOKEN:?Set your LocalStack authentication token}
      LAMBDA_DOCKER_NETWORK: appshell-sam-local_default
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:4566/_localstack/health']
      interval: 5s
      timeout: 5s
      retries: 30
  mailpit:
    image: axllent/mailpit:v1.29
    ports: ['127.0.0.1:8025:8025', '127.0.0.1:1025:1025']
